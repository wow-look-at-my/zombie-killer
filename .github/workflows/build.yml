name: build-and-test

on:
  push:
  pull_request:

env:
  GO_VERSION: '1.21'

jobs:
  build:
    name: Compile gozer + C helper + kernel module
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install kernel headers for the runner kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-$(uname -r)

      - name: Vet + build gozer
        run: |
          go vet ./...
          go build -v -o gozer main.go

      - name: Build test zombie spawner (C)
        run: cc -O2 -Wall -o makezombies test/makezombies.c

      - name: Build kernel module (kbuild against running kernel)
        # Makefile defaults KDIR to /lib/modules/$(uname -r)/build
        run: |
          make -C kernel-module
          test -f kernel-module/zombie_killer.ko

  test-gozer:
    name: End-to-end gozer test
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build gozer and spawner
        run: |
          go build -v -o gozer main.go
          cc -O2 -Wall -o makezombies test/makezombies.c

      - name: Spawn zombies, run gozer, assert none remain
        run: bash test/run-test.sh

  module-load:
    name: Load kernel module and reap zombies (best-effort)
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-$(uname -r)

      - name: Build module
        run: make -C kernel-module

      - name: Spawn zombies, insmod (sweeps on init), verify, rmmod
        run: sudo bash kernel-module/test.sh